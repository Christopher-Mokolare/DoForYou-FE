name: Frontend CI Pipeline

on:
  push:
    branches:
      - main-dev
      - main-qa
      - main
  pull_request:
    branches:
      - main-dev
      - main-qa
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - run: npm ci
      - run: npm run build