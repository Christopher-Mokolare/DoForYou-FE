# This file should be placed in your BACKEND repository at:
# .github/workflows/deploy.yml

name: Backend Deploy Pipeline

on:
  push:
    branches:
      - main-dev
      - main-qa
      - main
  pull_request:
    branches:
      - main-qa
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal

  deploy-backend-dev:
    if: github.ref == 'refs/heads/main-dev'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Railway Dev
        uses: railwayapp/railway-deploy@v1
        with:
          railway-token: ${{ secrets.RAILWAY_TOKEN_DEV }}
          service: ${{ secrets.RAILWAY_SERVICE_DEV }}

  deploy-backend-qa:
    if: github.ref == 'refs/heads/main-qa'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Railway QA
        uses: railwayapp/railway-deploy@v1
        with:
          railway-token: ${{ secrets.RAILWAY_TOKEN_QA }}
          service: ${{ secrets.RAILWAY_SERVICE_QA }}

  deploy-backend-prod:
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Railway Production
        uses: railwayapp/railway-deploy@v1
        with:
          railway-token: ${{ secrets.RAILWAY_TOKEN_PROD }}
          service: ${{ secrets.RAILWAY_SERVICE_PROD }}