<div class="min-vh-100 d-flex align-items-center py-5" style="background: linear-gradient(135deg, var(--light) 0%, var(--light-color) 100%);">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-10 col-lg-12">
        <div class="card border-0 rounded-4" style="box-shadow: 0 20px 40px rgba(0,0,0,0.1);">
          <div class="row g-0">
            <!-- Left Panel -->
            <div class="col-lg-5 d-flex align-items-center" style="background: linear-gradient(135deg, var(--primary) 0%, #E64A19 100%); color: var(--light-color);">
              <div class="p-5 text-center w-100">
                <h1 class="h3 mb-4 fw-light">Welcome Back!</h1>
                <p class="mb-5" style="opacity: 0.9;">Signed in to continue your DoForYou journey</p>
                
                <div class="row text-center">
                  <div class="col-6">
                    <div class="mb-3 p-3 rounded-3" style="background: rgba(255,255,255,0.1);">
                      <i class="fas fa-shield-alt fa-2x mb-2" style="color: var(--orange);"></i>
                      <h6 class="fw-normal">Secure</h6>
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="mb-3 p-3 rounded-3" style="background: rgba(255,255,255,0.1);">
                      <i class="fas fa-bolt fa-2x mb-2" style="color: var(--orange);"></i>
                      <h6 class="fw-normal">Fast</h6>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            
            <!-- Right Panel -->
            <div class="col-lg-7">
              <div class="p-5">
                <div class="mb-4">
                  <h2 class="h4 mb-2" style="color: var(--text-color);">Sign In</h2>
                  <p class="small" style="color: var(--gray);">Enter your credentials to access your account</p>
                </div>
                
                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                  <div class="mb-4">
                    <input
                      type="email"
                      id="email"
                      formControlName="email"
                      class="form-control form-control-lg"
                      placeholder="Email Address"
                      [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                    <div class="invalid-feedback" *ngIf="loginForm.get('email')?.errors?.['required']">
                      Email is required
                    </div>
                    <div class="invalid-feedback" *ngIf="loginForm.get('email')?.errors?.['email']">
                      Please enter a valid email
                    </div>
                  </div>

                  <div class="mb-4">
                    <div class="input-group input-group-lg">
                      <input
                        [type]="showPassword ? 'text' : 'password'"
                        id="password"
                        formControlName="password"
                        class="form-control"
                        placeholder="Password"
                        [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                      <button type="button" class="btn" style="border: 1px solid #dee2e6; color: var(--gray);" (click)="showPassword = !showPassword">
                        <i class="fas fa-eye" [class.fa-eye-slash]="showPassword"></i>
                      </button>
                    </div>
                    <div class="invalid-feedback" *ngIf="loginForm.get('password')?.errors?.['required']">
                      Password is required
                    </div>
                    <div class="invalid-feedback" *ngIf="loginForm.get('password')?.errors?.['minlength']">
                      Password must be at least 6 characters
                    </div>
                  </div>

                  <div class="alert border-0 rounded-3" *ngIf="errorMessage" style="background: rgba(220, 53, 69, 0.1); color: #dc3545;">
                    <i class="fas fa-exclamation-circle me-2"></i>{{ errorMessage }}
                  </div>

                  <button
                    type="submit"
                    class="btn w-100 py-3 mb-4 fw-semibold rounded-3"
                    style="background: linear-gradient(135deg, var(--primary) 0%, #E64A19 100%); border: none; color: var(--light-color); box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);"
                    [disabled]="loginForm.invalid">
                    Sign In
                  </button>
                  
                  <div class="text-center">
                    <span class="small" style="color: var(--gray);">Don't have an account? </span>
                    <a routerLink="/register" class="text-decoration-none fw-semibold" style="color: var(--primary);">Sign Up</a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
