<div class="min-vh-100 d-flex align-items-center py-5" style="background: linear-gradient(135deg, var(--light) 0%, var(--light-color) 100%);">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-xl-10 col-lg-12">
        <div class="card border-0 rounded-4" style="box-shadow: 0 20px 40px rgba(0,0,0,0.1);">
          <div class="row g-0">
            <!-- Left Panel -->
            <div class="col-lg-5 d-flex align-items-center" style="background: linear-gradient(135deg, var(--primary) 0%, #E64A19 100%); color: var(--light-color);">
              <div class="p-5 text-center w-100">
                <h1 class="h3 mb-4 fw-light">Join DoForYou</h1>
                <p class="mb-5" style="opacity: 0.9;">Connect with your community through tasks and services</p>
                
                <div class="row text-center">
                  <div class="col-6">
                    <div class="mb-3 p-3 rounded-3" style="background: rgba(255,255,255,0.1);">
                      <i class="fas fa-plus-circle fa-2x mb-2" style="color: var(--orange);"></i>
                      <h6 class="fw-normal">Post Tasks</h6>
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="mb-3 p-3 rounded-3" style="background: rgba(255,255,255,0.1);">
                      <i class="fas fa-handshake fa-2x mb-2" style="color: var(--orange);"></i>
                      <h6 class="fw-normal">Earn Money</h6>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            
            <!-- Right Panel -->
            <div class="col-lg-7">
              <div class="p-5">
                <div class="mb-4">
                  <h2 class="h4 mb-2" style="color: var(--text-color);">Create Account</h2>
                  <p class="small" style="color: var(--gray);">Please fill in your information below</p>
                </div>
                
                <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                  <div class="row g-3 mb-4">
                    <div class="col-md-6">
                      <input
                        type="text"
                        id="firstName"
                        formControlName="firstName"
                        class="form-control"
                        placeholder="First Name"
                        [class.is-invalid]="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched">
                      <div class="invalid-feedback" *ngIf="hasError('firstName', 'required')">
                        Required
                      </div>
                    </div>
                    <div class="col-md-6">
                      <input
                        type="text"
                        id="lastName"
                        formControlName="lastName"
                        class="form-control"
                        placeholder="Last Name"
                        [class.is-invalid]="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched">
                      <div class="invalid-feedback" *ngIf="hasError('lastName', 'required')">
                        Required
                      </div>
                    </div>
                  </div>

                  <div class="row g-3 mb-4">
                    <div class="col-md-6">
                      <input
                        type="email"
                        id="email"
                        formControlName="email"
                        class="form-control"
                        placeholder="Email Address"
                        [class.is-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
                      <div class="invalid-feedback" *ngIf="hasError('email', 'required')">
                        Valid email required
                      </div>
                    </div>
                    <div class="col-md-6">
                      <input
                        type="tel"
                        id="phoneNumber"
                        formControlName="phoneNumber"
                        class="form-control"
                        placeholder="Phone Number"
                        [class.is-invalid]="registerForm.get('phoneNumber')?.invalid && registerForm.get('phoneNumber')?.touched">
                      <div class="invalid-feedback" *ngIf="hasError('phoneNumber', 'required')">
                        Required
                      </div>
                    </div>
                  </div>

                  <div class="mb-4">
                    <select
                      id="userType"
                      formControlName="userType"
                      class="form-select">
                      <option value="">Choose your role...</option>
                      <option value="creator">I want to post tasks</option>
                      <option value="runner">I want to complete tasks</option>
                      <option value="both">Both - post and complete tasks</option>
                    </select>
                  </div>

                  <div class="row g-3 mb-4">
                    <div class="col-md-6">
                      <input
                        type="text"
                        id="idNumber"
                        formControlName="idNumber"
                        class="form-control"
                        placeholder="ID Number (Optional)"
                        maxlength="13"
                        (input)="onIdNumberChange()">
                    </div>
                    <div class="col-md-6" *ngIf="dateOfBirth">
                      <input 
                        type="text" 
                        class="form-control bg-light" 
                        [value]="dateOfBirth" 
                        readonly>
                    </div>
                  </div>

                  <div class="mb-4">
                    <input
                      type="text"
                      id="address"
                      formControlName="address"
                      class="form-control"
                      placeholder="Address (Optional)">
                  </div>

                  <div class="row g-3 mb-4">
                    <div class="col-md-6">
                      <div class="input-group">
                        <input
                          [type]="showPassword ? 'text' : 'password'"
                          id="password"
                          formControlName="password"
                          class="form-control"
                          placeholder="Password"
                          [class.is-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
                        <button type="button" class="btn" style="border: 1px solid #dee2e6; color: var(--gray);" (click)="showPassword = !showPassword">
                          <i class="fas fa-eye" [class.fa-eye-slash]="showPassword"></i>
                        </button>
                      </div>
                      <div class="invalid-feedback" *ngIf="hasError('password', 'required')">
                        Password required
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="input-group">
                        <input
                          [type]="showConfirmPassword ? 'text' : 'password'"
                          id="confirmPassword"
                          formControlName="confirmPassword"
                          class="form-control"
                          placeholder="Confirm Password"
                          [class.is-invalid]="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched">
                        <button type="button" class="btn" style="border: 1px solid #dee2e6; color: var(--gray);" (click)="showConfirmPassword = !showConfirmPassword">
                          <i class="fas fa-eye" [class.fa-eye-slash]="showConfirmPassword"></i>
                        </button>
                      </div>
                      <div class="invalid-feedback" *ngIf="registerForm.hasError('passwordMismatch')">
                        Passwords must match
                      </div>
                    </div>
                  </div>

                  <div class="alert border-0 rounded-3" *ngIf="errorMessage" style="background: rgba(220, 53, 69, 0.1); color: #dc3545;">
                    <i class="fas fa-exclamation-circle me-2"></i>{{ errorMessage }}
                  </div>

                  <button
                    type="submit"
                    class="btn w-100 py-3 mb-3 fw-semibold rounded-3"
                    style="background: linear-gradient(135deg, var(--primary) 0%, #E64A19 100%); border: none; color: var(--light-color); box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);"
                    [disabled]="registerForm.invalid">
                    Create Account
                  </button>
                  
                  <div class="text-center">
                    <span class="small" style="color: var(--gray);">Already have an account? </span>
                    <a routerLink="/login" class="text-decoration-none fw-semibold" style="color: var(--primary);">Sign In</a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
