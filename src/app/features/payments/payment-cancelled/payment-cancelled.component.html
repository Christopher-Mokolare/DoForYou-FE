<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card text-center">
        <div class="card-body p-5">
          <i class="fas fa-times-circle fa-4x text-warning mb-4"></i>
          <h2 class="text-warning mb-3">Payment Cancelled</h2>
          <p class="lead mb-4">Your payment was cancelled.</p>
          <p class="mb-4">No charges were made. You can try posting your task again.</p>
          <div class="d-flex gap-3 justify-content-center">
            <button class="btn btn-primary" (click)="tryAgain()">
              <i class="fas fa-redo me-2"></i>Try Again
            </button>
            <button class="btn btn-outline-secondary" (click)="goHome()">
              <i class="fas fa-home me-2"></i>Go Home
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
