<div class="user-type-selector">
  <h5 class="mb-3">User Type & Preferences</h5>
  <p class="text-muted mb-4">Choose how you want to use DoForYou:</p>
  
  <div class="row g-3">
    <div class="col-md-6">
      <div class="card h-100" [class.border-primary]="userType === 'creator'" 
           (click)="selectType('creator')" style="cursor: pointer;">
        <div class="card-body text-center">
          <i class="fas fa-plus-circle fa-2x text-primary mb-3"></i>
          <h6 class="card-title">Task Creator</h6>
          <p class="card-text small">Post tasks and hire helpers</p>
        </div>
      </div>
    </div>
    
    <div class="col-md-6">
      <div class="card h-100" [class.border-success]="userType === 'runner'" 
           (click)="selectType('runner')" style="cursor: pointer;">
        <div class="card-body text-center">
          <i class="fas fa-running fa-2x text-success mb-3"></i>
          <h6 class="card-title">Task Runner</h6>
          <p class="card-text small">Find and complete tasks to earn money</p>
        </div>
      </div>
    </div>
  </div>
</div>
