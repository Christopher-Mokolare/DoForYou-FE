<section class="testimonials-section bg-light py-5">
  <div class="container">
    <div class="row justify-content-center mb-5">
      <div class="col-md-8 text-center">
        <h2 class="section-title mb-4">What Our Users Say</h2>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-3 col-md-6 mb-4" *ngFor="let testimonial of testimonials">
        <div class="testimonial-card h-100 p-4 bg-white rounded shadow-sm">
          <p class="mb-4">"{{testimonial.quote}}"</p>
          <div class="testimonial-author">
            <strong>{{testimonial.name}}</strong>
            <span>{{testimonial.role}}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
