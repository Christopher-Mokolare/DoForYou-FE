<div class="modal fade" [class.show]="isVisible" [style.display]="isVisible ? 'block' : 'none'" 
     tabindex="-1" *ngIf="config">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header" [ngClass]="getHeaderClass()">
        <h5 class="modal-title">
          <i [class]="getIconClass()"></i>
          <span class="title-text">{{ config.title }}</span>
        </h5>
        <button type="button" class="btn-close" (click)="close()"></button>
      </div>
      <div class="modal-body">
        <p>{{ config.message }}</p>
      </div>
      <div class="modal-footer">
        <button *ngIf="config.type === 'confirm'" 
                type="button" class="btn btn-secondary" (click)="cancel()">
          {{ config.cancelText || 'Cancel' }}
        </button>
        <button type="button" [class]="getButtonClass()" (click)="confirm()">
          {{ config.confirmText || 'OK' }}
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" [class.show]="isVisible" *ngIf="isVisible"></div>
