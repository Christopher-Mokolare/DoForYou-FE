<div class="notifications-page">
  <div class="page-header">
    <h1>Notifications</h1>
    <div class="header-actions">
      <button class="btn btn-sm btn-outline-secondary" (click)="markAllAsRead()" 
              [disabled]="!hasUnreadNotifications">
        <i class="fas fa-check-double"></i> Mark All Read
      </button>
      <button class="btn btn-sm btn-outline-danger" (click)="clearAll()">
        <i class="fas fa-trash"></i> Clear All
      </button>
    </div>
  </div>

  <div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading notifications...</p>
  </div>

  <div class="notification-list" *ngIf="!loading && notifications.length > 0; else noNotifications">
    <div class="notification-card" *ngFor="let notification of notifications" 
         [class.unread]="!notification.isRead"
         (click)="handleNotificationClick(notification)">
      <div class="notification-icon" [ngClass]="getIconBgClass(notification.type)">
        <i class="fas" [ngClass]="getIconClass(notification.type)"></i>
      </div>
      <div class="notification-content">
        <h4>{{notification.title}}</h4>
        <p>{{notification.message}}</p>
        <small>{{notification.createdAt | date:'short'}}</small>
      </div>
      <div class="notification-actions">
        <button class="btn-icon" (click)="viewTask(notification); $event.stopPropagation()" 
                *ngIf="notification.relatedTaskId || notification.type === 'new_message' || notification.type.includes('message')" 
                [title]="notification.type === 'new_message' || notification.type.includes('message') ? 'View Messages' : 'View Task'">
          <i class="fas" [ngClass]="notification.type === 'new_message' || notification.type.includes('message') ? 'fa-comments' : 'fa-eye'"></i>
        </button>
        <button class="btn-icon btn-danger" (click)="deleteNotification(notification); $event.stopPropagation()" title="Delete">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>
  </div>

  <ng-template #noNotifications>
    <div class="empty-state" *ngIf="!loading">
      <i class="fas fa-bell-slash"></i>
      <h3>No notifications yet</h3>
      <p>You'll see notifications here when there's activity on your tasks.</p>
    </div>
  </ng-template>
</div>
