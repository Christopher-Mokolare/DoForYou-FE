<nav
  class="navbar navbar-expand-lg navbar-light bg-transparent-white fixed-top shadow-sm"
>
  <div class="container">
    <a class="navbar-brand" routerLink="/">
      <strong class="brand-text">DoForYou</strong>
      <span class="text-primary"><b class="dot">.</b></span>
    </a>
    <button
      class="navbar-toggler gsap-hamburger"
      type="button"
      (click)="isMenuCollapsed = !isMenuCollapsed; animateHamburger()"
    >
      <div class="hamburger-box">
        <div class="hamburger-inner"></div>
      </div>
    </button>
    <div class="collapse navbar-collapse" [class.collapse]="!isMenuCollapsed">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/" routerLinkActive="active">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/about" routerLinkActive="active"
            >About</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/browse-errands" routerLinkActive="active"
            >Browse Errands</a
          >
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contact" routerLinkActive="active"
            >Contact</a
          >
        </li>
        
        <!-- Authentication Links -->
        <ng-container *ngIf="!isLoggedIn; else userMenu">
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/register" routerLinkActive="active">Register</a>
          </li>
        </ng-container>

        <ng-template #userMenu>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
              {{ currentUser?.name }}
            </a>
            <ul class="dropdown-menu">
              <!-- Regular User Links - Only show for non-admin users -->
              <div *ngIf="!isAdmin">
                <li><a class="dropdown-item" routerLink="/post-errand">Post Errand</a></li>
                <li><a class="dropdown-item" href="#">My Profile</a></li>
                <li><a class="dropdown-item" href="#">My Errands</a></li>
                <li><hr class="dropdown-divider"></li>
              </div>

              <!-- Admin Links - Only show for admin users -->
              <div *ngIf="isAdmin">
                <li><h6 class="dropdown-header">Admin Panel</h6></li>
                <li><a class="dropdown-item" routerLink="/admin/dashboard">
                  <i class="bi bi-speedometer2"></i> Dashboard
                </a></li>
                <li><a class="dropdown-item" routerLink="/admin/users">
                  <i class="bi bi-people"></i> Manage Users
                </a></li>
                <li><a class="dropdown-item" routerLink="/admin/tasks">
                  <i class="bi bi-list-task"></i> Manage Tasks
                </a></li>
                <li><a class="dropdown-item" routerLink="/admin/payments">
                  <i class="bi bi-credit-card"></i> Manage Payments
                </a></li>
                <li><hr class="dropdown-divider"></li>
              </div>

              <!-- Logout - Show for all logged-in users -->
              <li><a class="dropdown-item" (click)="logout()">
                <i class="bi bi-box-arrow-right"></i> Logout
              </a></li>
            </ul>
          </li>
        </ng-template>

        <!-- Post Errand Button - Only show for non-admin users -->
        <li class="nav-item" *ngIf="!isAdmin">
          <a class="nav-link post-errand-link" (click)="postErrand()">
            POST AN ERRAND
            <span class="pulse-dot"></span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
