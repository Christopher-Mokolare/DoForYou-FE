<section class="contact-hero py-5 bg-light">
  <div class="container">
    <div class="row align-items-center justify-content-center">
      <div class="col-lg-6 text-center">
        <h1 class="display-4 mb-4">Contact Us</h1>
        <p class="lead">Give us a shout anytime! We would love to hear from you!</p>
      </div>
    </div>
  </div>
</section>

<section class="contact-form-section py-5">
  <div class="container">
    <div class="row justify-content-center text-center mb-5">
      <div class="col-7">
        <h2>Contact Us</h2>
        <p>Contact us on any of the channels below and we will get back to you ASAP!</p>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-8 mb-5">
        <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
          <div class="form-group row mb-4">
            <div class="col-md-6 mb-4 mb-lg-0">
              <input type="text" class="form-control" placeholder="First name" 
                     [(ngModel)]="contactData.firstName" name="firstName" required>
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control" placeholder="Last name" 
                     [(ngModel)]="contactData.lastName" name="lastName" required>
            </div>
          </div>
          <div class="form-group row mb-4">
            <div class="col-md-12">
              <input type="email" class="form-control" placeholder="Email address" 
                     [(ngModel)]="contactData.email" name="email" required>
            </div>
          </div>
          <div class="form-group row mb-4">
            <div class="col-md-12">
              <textarea name="message" class="form-control" placeholder="Write your message." 
                        cols="30" rows="10" [(ngModel)]="contactData.message" required></textarea>
            </div>
          </div>
          <div class="form-group row">
            <div class="col-md-6 mr-auto">
              <button type="submit" class="btn btn-primary btn-block py-3 px-5" 
                      [disabled]="!contactForm.valid">Send Message</button>
            </div>
          </div>
        </form>
      </div>
      <div class="col-lg-4">
        <div class="bg-white p-3 p-md-5 h-100">
          <h3 class="mb-4">Contact Info</h3>
          <ul class="list-unstyled">
            <li class="d-block mb-3">
              <span class="d-block fw-bold">Address:</span>
              <span>69 General Hertzog Rd, Three Rivers, Vereeniging 1934</span>
            </li>
            <li class="d-block mb-3">
              <span class="d-block fw-bold">Phone:</span>
              <span>+2761 431 7474</span>
            </li>
            <li class="d-block mb-3">
              <span class="d-block fw-bold">Email:</span>
              <!-- <span>info@doforyou.co.za</span> -->
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
